name: Release

# Triggered when a semver tag is pushed (e.g. v0.6.0).
# Builds all 5 service images, publishes to GHCR tagged with the semver
# AND :latest, and creates a GitHub Release.
#
# To cut a release:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish (${{ matrix.service }})
    runs-on: lab
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ingest, parser, analytics, web]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Derive version from tag
        id: version
        run: echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/sentania-labs/deep-analysis-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/sentania-labs/deep-analysis-${{ matrix.service }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}
            GIT_COMMIT=${{ github.sha }}

  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: lab
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Images published to GHCR (public, pullable without auth):

            - `ghcr.io/sentania-labs/deep-analysis-auth:${{ github.ref_name }}`
            - `ghcr.io/sentania-labs/deep-analysis-ingest:${{ github.ref_name }}`
            - `ghcr.io/sentania-labs/deep-analysis-parser:${{ github.ref_name }}`
            - `ghcr.io/sentania-labs/deep-analysis-analytics:${{ github.ref_name }}`
            - `ghcr.io/sentania-labs/deep-analysis-web:${{ github.ref_name }}`

            Also tagged as `:latest`.

            See the compose stack and deploy guide in the repo for self-hosting.
