name: CI

# openapi-drift CI job deferred until W5 (OpenAPI spec surface stabilizes).
#
# RUNNER PLACEMENT (issue #161, `github-ci` skill). The rule is "the `lab`
# pool exists to reach the lab, not to avoid GitHub", and this repo is
# public, so GitHub-hosted minutes are free and unlimited here.
#
#   compose-smoke, smoke-ui   ubuntu-latest. They need a real Docker daemon
#                             for `docker compose`; lab runner pods have
#                             none. This is the correct home for a compose
#                             smoke test, not a lab job.
#   test-integration          ubuntu-latest. It needs a PostgreSQL and a
#                             Redis daemon, which Actions `services:`
#                             provides directly.
#   diagram-drift             ubuntu-latest. The lab runner image is missing
#                             chromium's NSS libraries (see the job).
#   lint, typecheck,          lab. These fall under "needs none of the above
#   test-common, docker-build -> either", and keeping them on the lab pool
#                             is a deliberate choice: it exercises the pool
#                             on every push and keeps the shared in-cluster
#                             BuildKit path warm. Nothing about them
#                             requires the lab, so they can move if that
#                             ever stops being useful.
#
# `runs-on: lab` is an exact ARC scale-set name, not a label array: array
# forms never match this pool and queue silently for a day.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: uv sync
        run: uv sync --all-packages --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: JWT key path drift guard
        run: bash ci/check-compose-paths.sh

  typecheck:
    name: typecheck
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: uv sync
        run: uv sync --all-packages --dev
      # TODO: scope expands as services fill in — stubs are type-clean today.
      - name: mypy
        run: uv run mypy common/ services/

  # Job name is load-bearing: it is a required status check on the protected
  # branch, so it stays `test-common` even though it now also runs the
  # analytics suite. Analytics tests are pure unit tests (no postgres, no
  # redis), so they belong in the cheap no-services job rather than paying
  # for fixtures they never touch.
  test-common:
    name: test-common
    runs-on: lab
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: uv sync
        run: uv sync --all-packages --dev
      - name: pytest tests/common
        run: uv run pytest tests/common/
      - name: pytest tests/test_route_prefix_convention.py
        run: uv run pytest tests/test_route_prefix_convention.py
      - name: pytest services/analytics/tests
        run: uv run pytest services/analytics/tests/

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-common]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    # A job that needs a database daemon is a GitHub-hosted job (issue #161).
    # Actions `services:` starts real postgres and redis containers next to
    # the job, which is what these tests want and what the URLs below assume.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deep_analysis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deep_analysis
      DA_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deep_analysis
      DA_REDIS_URL: redis://localhost:6379/0
      # services/parser/tests/conftest.py gates its DB-backed fixtures on this
      # var and skips them when unset. Without it 24 of the parser tests would
      # sit in CI as silent skips. Points at the same postgres the rest of this
      # job uses; the fixture owns its schema and truncates between tests.
      DA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deep_analysis
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: uv sync
        run: uv sync --all-packages --dev
      - name: Generate throwaway JWT keypair
        run: |
          uv run python -m auth_service.keygen --out "$RUNNER_TEMP"
          echo "DA_JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/jwt_private.pem" >> "$GITHUB_ENV"
          echo "DA_JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/jwt_public.pem" >> "$GITHUB_ENV"
      - name: alembic upgrade head (root)
        run: uv run alembic upgrade head
      - name: alembic upgrade head (auth)
        run: uv run alembic -c services/auth/alembic.ini upgrade head
      - name: alembic upgrade head (ingest)
        run: uv run alembic -c services/ingest/alembic.ini upgrade head
      - name: pytest tests/integration
        run: uv run pytest tests/integration/
      - name: pytest services/auth/tests
        run: uv run pytest services/auth/tests/
      - name: pytest services/ingest/tests
        run: uv run pytest services/ingest/tests/
      - name: pytest services/web/tests
        run: uv run pytest services/web/tests/
      # Last: the parser fixture truncates parser.* between tests, so it runs
      # after everything else has finished with the shared database.
      - name: pytest services/parser/tests
        run: uv run pytest services/parser/tests/

  docker-build:
    name: docker-build (${{ matrix.service }})
    runs-on: lab
    needs: [lint, typecheck, test-common]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ingest, parser, analytics, web]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: deep-analysis-${{ matrix.service }}:ci

  # Restored to ubuntu-latest by issue #161. #136 deleted these jobs
  # because lab runner pods have no Docker daemon; the placement rule says
  # the answer was to move them to a GitHub-hosted runner, not to drop the
  # only coverage of the composed stack.
  #
  # Both invoke ci/smoke.sh, the SAME script README tells a human to run
  # before pushing. One definition, two callers. The script owns stack
  # setup, the health waits, the log dump on failure, and teardown, so
  # these jobs stay three steps long and cannot drift from the local run.
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-common]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: API + gateway smoke
        run: bash ci/smoke.sh e2e

  smoke-ui:
    name: smoke-ui
    runs-on: ubuntu-latest
    needs: [compose-smoke]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Browser UI smoke
        run: bash ci/smoke.sh ui

  # Stays on ubuntu-latest: the shared lab runner image is missing chromium's
  # NSS runtime libraries (libnspr4.so, libnss3.so, libnssutil3.so), so the
  # browser exits 127 on launch. `playwright install --with-deps` cannot fix
  # that here either, since it shells out to apt-get and the runner pods have
  # no root. Tracked upstream as sentania-labs/homelab-runner#1. Move this
  # job to `lab` once those libraries are baked into the image.
  diagram-drift:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    needs: [lint, typecheck, test-common]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Sync diagram renderer deps
        working-directory: docs/diagrams
        run: uv sync
      - name: Install chromium
        working-directory: docs/diagrams
        run: uv run playwright install --with-deps chromium
      - name: Re-render all diagrams
        working-directory: docs/diagrams
        run: uv run render.py
      - name: Check for drift
        run: git diff --exit-code 'docs/diagrams/*.png'

# TODO(W5): openapi-drift CI job — generate from FastAPI at CI time, diff against
# committed openapi/auth.yaml; deferred to W5 where analytics OpenAPI is the
# primary AI-seam artifact.
