{% extends "base.html" %}

{% block title %}Log in &middot; Deep Analysis{% endblock %}

{% block body_layout %}
<main class="flex-1 pt-12 flex items-start justify-center px-4 sm:px-6 py-16">
    <section class="w-full max-w-md dark:bg-surface bg-surface-light border dark:border-border border-border-light rounded-md p-6 shadow-sm">
        <h1 class="text-lg font-semibold dark:text-txt-primary text-txt-primary-light mb-5">Log in</h1>
        {% if error %}
            <div class="bg-danger-muted border border-danger/20 text-danger rounded-md p-3 text-sm mb-4" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="flex flex-col gap-4">
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">Email</span>
                <input type="email" name="email" autocomplete="username" required autofocus
                       value="{{ email or '' }}"
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">Password</span>
                <input type="password" name="password" autocomplete="current-password" required
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
            </label>
            <div class="mt-1">
                <button type="submit" class="bg-accent text-white hover:bg-accent-hover rounded-md px-4 py-2 text-sm font-medium transition-colors">Log in</button>
            </div>
        </form>
    </section>
</main>
{% endblock %}
