{% extends "base.html" %}

{% block title %}Change password &middot; Deep Analysis{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <section class="dark:bg-surface bg-surface-light border dark:border-border border-border-light rounded-md p-6">
        <h1 class="text-lg font-semibold dark:text-txt-primary text-txt-primary-light mb-5">Change password</h1>
        {% if must_change %}
            <div class="bg-accent-muted border border-accent/20 text-accent rounded-md p-3 text-sm mb-4" role="status">
                You must change your password before continuing.
            </div>
        {% endif %}
        {% if error %}
            <div class="bg-danger-muted border border-danger/20 text-danger rounded-md p-3 text-sm mb-4" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/settings/password" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">Current password</span>
                <input type="password" name="current_password" autocomplete="current-password" required autofocus
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">New password</span>
                <input type="password" name="new_password" autocomplete="new-password" required
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
                <p class="text-xs dark:text-txt-tertiary text-txt-secondary-light mt-1">12 characters minimum</p>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">Confirm new password</span>
                <input type="password" name="confirm_password" autocomplete="new-password" required
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
            </label>
            <div class="mt-1">
                <button type="submit" class="bg-accent text-white hover:bg-accent-hover rounded-md px-4 py-2 text-sm font-medium transition-colors">Change password</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
