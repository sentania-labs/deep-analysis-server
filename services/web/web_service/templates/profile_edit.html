{% extends "base.html" %}

{% block title %}Edit profile &middot; Deep Analysis{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="dark:bg-surface bg-surface-light border dark:border-border border-border-light rounded-md p-6">
        <h1 class="text-lg font-semibold dark:text-txt-primary text-txt-primary-light mb-5">Edit profile</h1>
        {% if error %}
            <div class="bg-danger-muted border border-danger/20 text-danger rounded-md p-3 text-sm mb-4" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/profile/edit" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">Email</span>
                <input type="email" name="email" autocomplete="email" required autofocus
                       value="{{ email or '' }}"
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium dark:text-txt-secondary text-txt-secondary-light">MTGO Username(s)</span>
                <input type="text" name="mtgo_usernames" id="mtgo-usernames"
                       placeholder="e.g. sentania, MyAltAccount"
                       value="{{ mtgo_usernames_str or '' }}"
                       class="dark:bg-surface-3 bg-surface-light-3 border dark:border-border border-border-light rounded-md px-3 py-2 text-sm dark:text-txt-primary text-txt-primary-light focus:ring-2 focus:ring-accent focus:border-accent outline-none">
                <small class="text-xs dark:text-txt-tertiary text-txt-secondary-light">Comma-separated. Used to identify you in match results.</small>
            </label>
            <div class="flex items-center gap-2 -mt-2">
                <button type="button"
                        class="border dark:border-border border-border-light dark:text-txt-primary text-txt-primary-light hover:dark:bg-surface-2 hover:bg-surface-light-3 rounded-md px-2 py-1 text-xs transition-colors"
                        id="detect-usernames-btn"
                        title="Detect MTGO usernames from your uploaded match data">
                    Detect from matches
                </button>
                <span id="detect-status" class="text-xs dark:text-txt-tertiary text-txt-secondary-light"></span>
            </div>
            <div class="flex gap-2 mt-2">
                <button type="submit" class="bg-accent text-white hover:bg-accent-hover rounded-md px-4 py-2 text-sm font-medium transition-colors">Save</button>
                <a href="/profile" class="border dark:border-border border-border-light dark:text-txt-primary text-txt-primary-light hover:dark:bg-surface-2 hover:bg-surface-light-3 rounded-md px-4 py-2 text-sm no-underline transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var btn = document.getElementById('detect-usernames-btn');
    var input = document.getElementById('mtgo-usernames');
    var statusEl = document.getElementById('detect-status');
    if (!btn || !input) return;

    btn.addEventListener('click', function() {
        btn.disabled = true;
        statusEl.textContent = 'Detecting...';
        fetch('/profile/username-suggestions')
            .then(function(resp) {
                if (!resp.ok) throw new Error('Request failed');
                return resp.json();
            })
            .then(function(data) {
                if (data.length === 0) {
                    statusEl.textContent = 'No usernames found in match data.';
                } else {
                    var names = data.map(function(s) { return s.username; });
                    input.value = names.join(', ');
                    statusEl.textContent = 'Found ' + data.length + ' username(s).';
                }
            })
            .catch(function() {
                statusEl.textContent = 'Could not detect usernames.';
            })
            .finally(function() {
                btn.disabled = false;
            });
    });
})();
</script>
{% endblock %}
