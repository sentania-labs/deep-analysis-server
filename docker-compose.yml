# docker-compose.yml — Deep Analysis server stack
#
# Usage:
#   cp .env.example .env        # set POSTGRES_PASSWORD
#   docker compose up -d

name: deep-analysis

services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: deep_analysis
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d deep_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: ["redis-server", "--save", ""]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    networks:
      - backend
    environment:
      DATA_SOURCE_NAME: "postgresql://deep_analysis:${POSTGRES_PASSWORD}@postgres:5432/deep_analysis?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    networks:
      - backend
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis

  # One-shot jobs: apply alembic migrations on `compose up` and exit 0. The
  # deploy wrapper on docker.int rejects `compose exec`, so migrations have
  # to run as part of `compose up`. Ordering is enforced by depends_on with
  # `service_completed_successfully`:
  #   postgres healthy → root-migrate → auth-migrate → ingest-migrate → services.
  #
  # `root-migrate` runs the root alembic head, which creates the four
  # logical schemas (auth/ingest/parser/analytics) and the unprivileged
  # service roles. `auth-migrate` then applies auth's own tables (users,
  # sessions, agent_registrations). `ingest-migrate` must run after
  # `auth-migrate` because ingest migration 001 FK-references auth.users.
  # parser still has no migrate service of its own — that lands when parser
  # grows tables.
  #
  # DATABASE_URL must be a sync psycopg URL (alembic env.py uses the sync
  # engine), e.g. postgresql+psycopg://USER:PASS@postgres:5432/deep_analysis.
  # The async asyncpg URL used by the running services (DA_DATABASE_URL) is
  # not interchangeable here.
  root-migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["alembic", "-c", "/app/service/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      root-migrate:
        condition: service_completed_successfully
    restart: "no"

  ingest-migrate:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: ["alembic", "-c", "/app/service/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      root-migrate:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    image: caddy:2.9-alpine
    restart: unless-stopped

    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
      - backend
      - edge-slots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped

    networks:
      - backend
    environment:
      DA_SERVICE_NAME: auth
      DA_DATABASE_URL: ${DA_DATABASE_URL:-}
      DA_REDIS_URL: ${DA_REDIS_URL:-redis://redis:6379/0}
      DA_JWT_PRIVATE_KEY_PATH: ${DA_JWT_PRIVATE_KEY_PATH:-/data/secrets/jwt_private.pem}
      DA_JWT_PUBLIC_KEY_PATH: ${DA_JWT_PUBLIC_KEY_PATH:-/data/secrets/jwt_public.pem}
      DA_LOG_LEVEL: ${DA_LOG_LEVEL:-INFO}
      DEEP_ANALYSIS_BOOTSTRAP_ADMIN_EMAIL: ${DEEP_ANALYSIS_BOOTSTRAP_ADMIN_EMAIL:-}
      DEEP_ANALYSIS_BOOTSTRAP_ADMIN_PASSWORD: ${DEEP_ANALYSIS_BOOTSTRAP_ADMIN_PASSWORD:-}
      DEEP_ANALYSIS_FORCE_ADMIN_RESET: ${DEEP_ANALYSIS_FORCE_ADMIN_RESET:-false}
    volumes:
      - ./.secrets:/data/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped

    networks:
      - backend
    environment:
      DA_SERVICE_NAME: ingest
      DA_DATABASE_URL: ${DA_DATABASE_URL:-}
      DA_REDIS_URL: ${DA_REDIS_URL:-redis://redis:6379/0}
      DA_JWT_PUBLIC_KEY_PATH: ${DA_JWT_PUBLIC_KEY_PATH:-/data/secrets/jwt_public.pem}
      DA_INGEST_RAW_PATH: /data/raw
      DA_LOG_LEVEL: ${DA_LOG_LEVEL:-INFO}
    volumes:
      - raw_archive:/data/raw
      - ./.secrets:/data/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    restart: unless-stopped

    networks:
      - backend
    environment:
      DA_SERVICE_NAME: parser
      DA_DATABASE_URL: ${DA_DATABASE_URL:-}
      DA_REDIS_URL: ${DA_REDIS_URL:-redis://redis:6379/0}
      DA_JWT_PUBLIC_KEY_PATH: ${DA_JWT_PUBLIC_KEY_PATH:-/data/secrets/jwt_public.pem}
      DA_PARSER_RAW_PATH: /data/raw
      DA_LOG_LEVEL: ${DA_LOG_LEVEL:-INFO}
    volumes:
      - raw_archive:/data/raw:ro
      - ./.secrets:/data/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    restart: unless-stopped

    networks:
      - backend
    environment:
      DA_SERVICE_NAME: analytics
      DA_DATABASE_URL: ${DA_DATABASE_URL:-}
      DA_REDIS_URL: ${DA_REDIS_URL:-redis://redis:6379/0}
      DA_JWT_PUBLIC_KEY_PATH: ${DA_JWT_PUBLIC_KEY_PATH:-/data/secrets/jwt_public.pem}
      DA_LOG_LEVEL: ${DA_LOG_LEVEL:-INFO}
    volumes:
      - ./.secrets:/data/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    restart: unless-stopped

    networks:
      - frontend
      - backend
    environment:
      DA_SERVICE_NAME: web
      DA_DATABASE_URL: ${DA_DATABASE_URL:-}
      DA_REDIS_URL: ${DA_REDIS_URL:-redis://redis:6379/0}
      DA_JWT_PUBLIC_KEY_PATH: ${DA_JWT_PUBLIC_KEY_PATH:-/data/secrets/jwt_public.pem}
      DA_LOG_LEVEL: ${DA_LOG_LEVEL:-INFO}
    volumes:
      - ./.secrets:/data/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  frontend:
  backend:
  edge-slots:
    external: true

volumes:
  postgres_data:
  raw_archive:
